version: '3.8'

services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: testdb
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    # Healthcheck ensures MySQL is fully initialized before FastAPI starts
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: always
    ports:
      - "8888:8000"
    environment:
      # Format: mysql+aiomysql://<user>:<password>@<host>:<port>/<db_name>
      # Note the host is 'db', matching the service name above
      DATABASE_URL: mysql+aiomysql://user:password@db:3306/testdb
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - web

volumes:
  # This makes your database data persist even if the container stops
  db_data: